[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legends-jev"
version = "0.2.1"
description = "Bounded typed decision advice and optical recognition over supplied evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/avalonreset/legends-jev"
Issues = "https://github.com/avalonreset/legends-jev/issues"

[project.scripts]
legends-jev = "legends_jev.cli:main"

[tool.setuptools.packages.find]
include = ["legends_jev*"]

[tool.setuptools.package-data]
legends_jev = ["data/*.json", "docs/*.md"]
